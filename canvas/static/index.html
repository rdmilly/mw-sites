move',e=>{if(!dr)return;m.x=Math.round((ox+(e.clientX-sx)/zoom)/8)*8;m.y=Math.round((oy+(e.clientY-sy)/zoom)/8)*8;render()});window.addEventListener('mouseup',()=>{if(dr){dr=false;el.classList.remove('drag')}})}const cw=document.getElementById('cw');cw.addEventListener('mousedown',e=>{if(e.button===1||(e.button===0&&!e.target.closest('.card'))){panning=true;ps.x=e.clientX-px;ps.y=e.clientY-py;cw.classList.add('pan')}});window.addEventListener('mousemove',e=>{if(!panning)return;px=e.clientX-ps.x;py=e.clientY-ps.y;render()});window.addEventListener('mouseup',()=>{if(panning){panning=false;cw.classList.remove('pan')}});cw.addEventListener('wheel',e=>{e.preventDefault();const r=cw.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,oz=zoom;zoom=Math.min(2.5,Math.max(.25,zoom*(e.deltaY<0?1.08:.93)));px=mx-(mx-px)*(zoom/oz);py=my-(my-py)*(zoom/oz);render()},{passive:false});function adjZ(d){zoom=Math.min(2.5,Math.max(.25,zoom+d));render()}function resetView(){px=60;py=60;zoom=1;render()}function addMod(){const id=nextMid++;mods.push({id,x:200,y:150,type:'api',title:'module_'+id+'.py',badges:['new'],code:'# module_'+id+'\n\ndef run():\n    pass',deps:[],bd:[['Status','empty']],flow:[],fc:[]});render();openExp(id)}function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}render();</script></body></html>
